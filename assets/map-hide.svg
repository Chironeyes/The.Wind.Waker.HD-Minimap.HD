<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Fully closed bundle: every leaf is stacked under one rectangular face. -->
    <path d="M37 27 85 24 93 27 95 101 43 105 39 102Z" fill="#263530" opacity=".35" transform="translate(3 5)"/>
    <path d="M37 27 85 24 93 27 95 101 43 105 39 102Z" fill="#ead393" stroke="#fff8dc" stroke-width="9"/>
    <path d="M37 27 85 24 93 27 95 101 43 105 39 102Z" fill="#c5a469" stroke="#705139" stroke-width="4"/>
    <!-- Thin, tightly packed paper edges, never spread-out accordion panels. -->
    <path d="m88 29 2 71-47 3m48-73 2 70" fill="none" stroke="#f8e6b1" stroke-width="1.8"/>
    <path d="M37 27 85 24 87 99 39 102Z" fill="#ead393" stroke="#705139" stroke-width="3"/>
    <!-- Map markings remain on the outermost folded face. -->
    <path d="m49 44 8-6 11 5 1 10-8 9-13-4-3-9Z" fill="#779763" stroke="#617442" stroke-width="2.5"/>
    <path d="m63 78 6-4 5 5-2 8-7 1-4-5Z" fill="#779763" stroke="#617442" stroke-width="2.5"/>
    <path d="m47 72 7-4 7 3m9-36 7-3m-31 58 7-3m17-22 5-4 5 2" fill="none" stroke="#a38250" stroke-width="3"/>
    <path d="m43 33 35-2m-33 65 34-3" fill="none" stroke="#f8e6b1" stroke-width="2.5"/>
  </g>
</svg>
